<div class="container">

    <h1>🎵 MP3RAT 🐀</h1>

    <p>Pega un enlace de YouTube para descargar su audio.</p>

    <input
        type="text"
        id="url"
        placeholder="https://www.youtube.com/watch?v=..."
    >

    <br>

    <button onclick="descargar()">
        Descargar MP3
    </button>

    <div id="mensaje"></div>

</div>

<script>

    async function descargar() {

        const url = document
            .getElementById("url")
            .value
            .trim();

        const mensaje =
            document.getElementById("mensaje");

        if (!url) {
            mensaje.innerText =
                "❌ Pega un enlace primero.";
            return;
        }

        mensaje.innerText =
            "⏳ Descargando...";

        try {

            const respuesta = await fetch("/download", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    url: url
                })
            });

            const datos = await respuesta.json();

            if (datos.success) {

                mensaje.innerText =
                    "✅ ¡Descarga terminada!";

                const enlace =
                    document.createElement("a");

                enlace.href =
                    "/files/" +
                    encodeURIComponent(datos.filename);

                enlace.download =
                    datos.filename;

                document.body.appendChild(enlace);

                enlace.click();

                enlace.remove();

            } else {

                mensaje.innerText =
                    "❌ " + datos.error;

            }

        } catch (error) {

            mensaje.innerText =
                "❌ Error: " + error.message;

        }
    }

</script>
